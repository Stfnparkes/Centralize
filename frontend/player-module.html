// Per-game stat lines, written by the coach module (STAT-01) and read by
// players (STAT-05/06). Seed a representative sample for completed games.
const SEED_GAME_STATS = (() => {
  // Generate believable stat lines for completed games for every player
  const completed = ['gm-1','gm-2','gm-4','gm-5'];
  const out = [];
  let n = 0;
  for (const gid of completed) {
    for (const p of SEED_ROSTER) {
      n++;
      const base = (p.id.endsWith('-1') || p.id.endsWith('-2') || p.id.endsWith('-3') || p.id.endsWith('-4') || p.id.endsWith('-5')) ? 1.0 : 0.55;
      const seed = (n * 7919) % 97; const r = (k) => ((seed * (k+1)) % 11) / 10;
      out.push({
        id: `gs-${gid}-${p.id}`,
        gameId: gid,
        playerId: p.id,
        min: Math.round((20 + r(0)*16) * base),
        pts: Math.round((10 + r(1)*18) * base),
        ast: Math.round((2 + r(2)*7) * (p.position==='PG'?1.4: p.position==='SG'?1.05:0.7)),
        reb: Math.round((3 + r(3)*8) * (p.position==='C'?1.5: p.position==='PF'?1.3:0.7)),
        stl: Math.round(r(4)*3),
        blk: Math.round((p.position==='C'||p.position==='PF') ? r(5)*3 : r(5)*1),
        fga: Math.round((8 + r(6)*10) * base),
        fgm: Math.round((4 + r(7)*6) * base),
        tpa: Math.round(r(8)*7 * (p.position==='C'?0.2:1)),
        tpm: Math.round(r(9)*4 * (p.position==='C'?0.2:1)),
        fta: Math.round(r(0)*5),
        ftm: Math.round(r(1)*4),
        tov: Math.round(r(2)*3),
        pf:  Math.round(r(3)*4),
        updatedAt: Date.now() - 86400000 * 5,
      });
    }
  }
  return out;
})();

/* =========================================================================
   STORAGE LAYER — identical wrapper as coach module so keys are
   interoperable between the two HTML files when run in the same Cowork
   workspace.
   ========================================================================= */
const Storage = {
  async get(key) {
    if (!window.storage) return null;
    try { const r = await window.storage.get(key); return r?.value ? JSON.parse(r.value) : null; }
    catch { return null; }
  },
  async set(key, value) {
    if (!window.storage) return false;
    try { await window.storage.set(key, JSON.stringify(value)); return true; } catch { return false; }
  },
  async delete(key) {
    if (!window.storage) return false;
    try { await window.storage.delete(key); return true; } catch { return false; }
  },
  async list(prefix) {
    if (!window.storage) return [];
    try { const r = await window.storage.list(prefix); return r?.keys || []; } catch { return []; }
  },
};

/** Browser fallback so the file is openable offline without window.storage. */
if (typeof window !== 'undefined' && !window.storage) {
  const mem = {};
  window.storage = {
    async get(k){ if(!(k in mem)) throw new Error('not found'); return { value: mem[k] }; },
    async set(k,v){ mem[k] = v; return true; },
    async delete(k){ delete mem[k]; return true; },
    async list(p){ return { keys: Object.keys(mem).filter(k => k.startsWith(p)) }; },
  };
}

/* =========================================================================
   HOOKS — useCollection, useStored. Same semantics as coach module.
   ========================================================================= */
function useCollection(prefix, defaults = []) {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const keys = await Storage.list(`${prefix}:`);
      const seeded = await Storage.get(`${prefix}:__seeded`);
      const itemKeys = keys.filter((k) => !k.endsWith(':__seeded'));
      const all = await Promise.all(itemKeys.map((k) => Storage.get(k)));
      const valid = all.filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      if (!seeded && valid.length === 0 && defaults.length > 0) {
        await Storage.set(`${prefix}:__seeded`, true);
        for (const d of defaults) await Storage.set(`${prefix}:${d.id}`, { ...d, updatedAt: d.updatedAt || Date.now() });
        if (!cancelled) setItems([...defaults]);
      } else if (!cancelled) {
        setItems(valid);
      }
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [prefix]);

  const save = useCallback(async (item) => {
    const id = item.id || `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    const next = { ...item, id, updatedAt: Date.now() };
    await Storage.set(`${prefix}:${id}`, next);
    setItems((prev) => {
      const idx = prev.findIndex((p) => p.id === id);
      if (idx === -1) return [next, ...prev];
      const arr = [...prev]; arr[idx] = next; return arr;
    });
    return next;
  }, [prefix]);

  const remove = useCallback(async (id) => {
    await Storage.delete(`${prefix}:${id}`);
    setItems((prev) => prev.filter((p) => p.id !== id));
  }, [prefix]);

  return { items, save, remove, loaded, setItems };
}

function useStored(key, initial) {
  const [value, setValue] = useState(initial);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const v = await Storage.get(key);
      if (v !== null && !cancelled) setValue(v);
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [key]);
  const setAndStore = useCallback((v) => {
    setValue((prev) => {
      const next = typeof v === 'function' ? v(prev) : v;
      Storage.set(key, next);
      return next;
    });
  }, [key]);
  return [value, setAndStore, loaded];
}

function Modal({ open, onClose, title, subtitle, children, footer, size = 'md' }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  const sizes = { sm: 'max-w-md', md: 'max-w-lg', lg: 'max-w-2xl', xl: 'max-w-4xl' };
  return (
    <div className="fixed inset-0 z-50 bg-stone-950/65 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
      <div className={`bg-white rounded-2xl shadow-2xl w-full ${sizes[size] || sizes.md} max-h-[92vh] flex flex-col`} onClick={(e) => e.stopPropagation()}>
        <div className="px-5 py-4 border-b border-stone-200 flex items-center justify-between">
          <div>
            <h2 className="font-display text-lg font-semibold text-stone-900">{title}</h2>
            {subtitle && <p className="text-[12.5px] text-stone-500 mt-0.5">{subtitle}</p>}
          </div>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-700 -mr-1.5 p-1.5 rounded hover:bg-stone-100"><I.Close className="w-5 h-5"/></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5">{children}</div>
        {footer && <div className="px-5 py-3 border-t border-stone-200 bg-stone-50 flex items-center justify-end gap-2 rounded-b-2xl">{footer}</div>}
      </div>
    </div>
  );
}

const newId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

function fmtRelative(ts) {
  if (!ts) return '—';
  const diff = Date.now() - ts;
  const s = Math.round(diff/1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s/60); if (m < 60) return `${m}m ago`;
  const h = Math.round(m/60); if (h < 24) return `${h}h ago`;
  const d = Math.round(h/24); if (d < 30) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

/* =========================================================================
   COURT VIEWER — read-only SVG court for PLAY-15 / VID-09.
   Same coordinate system as coach module.
   ========================================================================= */
function CourtView({ positions = {}, drawings = [], courtTemplate = 'half', height = 360 }) {
  // Draw the standard NBA half-court with shading.
  const W = COURT.W, H = COURT.H;
  // Compose arrow markers
  return (
    <svg viewBox={`-10 -10 ${W+20} ${H+20}`} preserveAspectRatio="xMidYMid meet" style={{ width: '100%', height }} className="rounded-lg shadow-sm">
      <defs>
        <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%"  stopColor="var(--court-wood-light)"/>
          <stop offset="55%" stopColor="var(--court-wood-mid)"/>
          <stop offset="100%" stopColor="var(--court-wood-dark)"/>
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="#0f172a"/>
        </marker>
      </defs>
      <rect x={-10} y={-10} width={W+20} height={H+20} fill="url(#wood)"/>
      {/* Boundary */}
      <rect x={0} y={0} width={W} height={H} fill="none" stroke="var(--court-line)" strokeWidth="3"/>
      {/* Key */}
      <rect x={COURT.KEY.x} y={COURT.KEY.y} width={COURT.KEY.w} height={COURT.KEY.h} fill="rgba(217,119,6,0.15)" stroke="var(--court-line)" strokeWidth="2.5"/>
      {/* FT circle */}
      <circle cx={COURT.FT.cx} cy={COURT.FT.cy} r={COURT.FT.r} fill="none" stroke="var(--court-line)" strokeWidth="2.5"/>
      {/* Restricted */}
      <path d={`M ${COURT.RESTRICTED.cx - COURT.RESTRICTED.r} ${COURT.RESTRICTED.cy} A ${COURT.RESTRICTED.r} ${COURT.RESTRICTED.r} 0 0 0 ${COURT.RESTRICTED.cx + COURT.RESTRICTED.r} ${COURT.RESTRICTED.cy}`} fill="none" stroke="var(--court-line)" strokeWidth="2"/>
      {/* 3-pt */}
      <path d={`M ${COURT.THREEPT.cornerX1} ${COURT.THREEPT.cornerY} L ${COURT.THREEPT.cornerX1} 0 M ${COURT.THREEPT.cornerX2} ${COURT.THREEPT.cornerY} L ${COURT.THREEPT.cornerX2} 0 M ${COURT.THREEPT.cornerX1} ${COURT.THREEPT.cornerY} A ${COURT.THREEPT.arcR} ${COURT.THREEPT.arcR} 0 0 0 ${COURT.THREEPT.cornerX2} ${COURT.THREEPT.cornerY}`} fill="none" stroke="var(--court-line)" strokeWidth="2.5"/>
      {/* Half-court line + circle */}
      <line x1={0} y1={H} x2={W} y2={H} stroke="var(--court-line)" strokeWidth="3"/>
      <circle cx={W/2} cy={H} r={36} fill="none" stroke="var(--court-line)" strokeWidth="2"/>
      {/* Backboard + rim */}
      <line x1={COURT.BACKBOARD.x1} y1={COURT.BACKBOARD.y} x2={COURT.BACKBOARD.x2} y2={COURT.BACKBOARD.y} stroke="#1e293b" strokeWidth="3"/>
      <circle cx={COURT.HOOP.x} cy={COURT.HOOP.y} r={COURT.HOOP.r} fill="none" stroke="#dc2626" strokeWidth="2"/>

      {/* Drawings */}
      {drawings.map((d) => {
        const stroke = d.type === 'pass' ? '#0f172a' : d.type === 'screen' ? '#dc2626' : d.type === 'dribble' ? '#0d9488' : '#1e40af';
        const dash = d.type === 'pass' ? '6 4' : d.type === 'dribble' ? '2 3' : '0';
        return (
          <g key={d.id || `dr-${d.x1}-${d.y1}-${d.x2}-${d.y2}`}>
            <line x1={d.x1} y1={d.y1} x2={d.x2} y2={d.y2} stroke={stroke} strokeWidth="2.4" strokeDasharray={dash} markerEnd="url(#arrow)"/>
          </g>
        );
      })}
      {/* Players */}
      {Object.entries(positions).map(([id, p]) => {
        if (!p) return null;
        const isDef = id.startsWith('d');
        const fill = isDef ? 'var(--defense)' : 'var(--offense)';
        const label = id.replace(/^[od]/, '');
        return (
          <g key={id}>
            <circle cx={p.x} cy={p.y} r={14} fill={fill} stroke="white" strokeWidth="2.4"/>
            <text x={p.x} y={p.y + 4} textAnchor="middle" fontSize="13" fontWeight="700" fill="white" style={{ pointerEvents: 'none' }}>{label}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* =========================================================================
   DASHBOARD (DASH-01..05) — role-specific landing page for a player.
   ========================================================================= */
function DashboardPage({ currentUser, roster }) {
  const { go } = useRouter();
  const games = useCollection('games', SEED_GAMES);
  const stats = useCollection('gameStats', SEED_GAME_STATS);
  const training = useCollection('training', SEED_TRAINING);
  const messages = useCollection('messages', SEED_MESSAGES);
  const profiles = useCollection('playerProfiles', SEED_PLAYER_PROFILES);

  const myProfile = profiles.items.find(p => p.playerId === currentUser.id);
  const myStats = stats.items.filter(s => s.playerId === currentUser.id);
  const completedGames = games.items.filter(g => g.status === 'completed').sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const wins = games.items.filter(g => g.status === 'completed' && (g.teamScore||0) > (g.oppScore||0)).length;
  const losses = games.items.filter(g => g.status === 'completed' && (g.teamScore||0) < (g.oppScore||0)).length;

  // DASH-04: next training session (date >= today)
  const today = new Date().toISOString().slice(0,10);
  const upcoming = [...training.items].filter(t => (t.date||'') >= today).sort((a,b) => (a.date||'').localeCompare(b.date||''))[0];

  // DASH-02: team leaders by category — derived from stats
  const leaders = useMemo(() => {
    const cats = ['pts','ast','reb','stl','blk'];
    const out = {};
    for (const c of cats) {
      const tallies = {};
      for (const s of stats.items) tallies[s.playerId] = (tallies[s.playerId] || 0) + (s[c] || 0);
      const sorted = Object.entries(tallies).sort((a,b) => b[1] - a[1]).slice(0, 3);
      out[c] = sorted.map(([pid, total]) => {
        const games = stats.items.filter(s => s.playerId === pid).length || 1;
        const pl = roster.find(r => r.id === pid);
        return { player: pl, avg: total / games, total };
      });
    }
    return out;
  }, [stats.items, roster]);

  // DASH-05: unread count for this player
  const unread = messages.items.filter(m => {
    if (m.from?.userId === currentUser.id) return false;
    const isMine = m.to?.scope === 'team' || (m.to?.scope === 'player' && m.to?.playerId === currentUser.id);
    return isMine && !(m.readBy && m.readBy[currentUser.id]);
  }).length;

  // Quick personal averages
  const avg = (key) => myStats.length ? (myStats.reduce((a,s) => a + (s[key]||0), 0) / myStats.length) : 0;

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <PageHeader title={`Welcome back, ${currentUser.name.split(' ').slice(-1)[0]}`}
        subtitle={`#${currentUser.number} • ${currentUser.position} • ${myStats.length} games played`}/>
      <div className="flex-1 overflow-y-auto p-7">
        <div className="grid grid-cols-12 gap-5">
          {/* My stat tiles */}
          <div className="col-span-12 lg:col-span-8 grid grid-cols-4 gap-3">
            {[
              { key:'pts', label:'PPG', val: avg('pts').toFixed(1) },
              { key:'ast', label:'APG', val: avg('ast').toFixed(1) },
              { key:'reb', label:'RPG', val: avg('reb').toFixed(1) },
              { key:'stl', label:'SPG', val: avg('stl').toFixed(1) },
            ].map(t => (
              <button key={t.key} onClick={() => go('myStats')} className="bg-white rounded-xl border border-stone-200 p-4 text-left hover:shadow-sm hover:border-blue-200 transition">
                <div className="text-[11px] font-semibold text-stone-500 uppercase tracking-wider">{t.label}</div>
                <div className="font-display text-3xl font-bold text-stone-900 mt-1">{t.val}</div>
                <div className="text-[11px] text-stone-400 mt-0.5">across {myStats.length} games</div>
              </button>
            ))}
          </div>
          {/* W/L Donut (DASH-03 + STAT-07) */}
          <div className="col-span-12 lg:col-span-4 bg-white rounded-xl border border-stone-200 p-4">
            <div className="text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-2">Season record</div>
            <div className="flex items-center gap-4">
              <WLDonut wins={wins} losses={losses}/>

                <div className="text-[26px] font-display font-bold text-stone-900 leading-none">{wins}<span className="text-stone-400">–</span>{losses}</div>
                <div className="text-[11.5px] text-stone-500 mt-1">{wins + losses ? Math.round(wins/(wins+losses)*100) : 0}% win rate</div>
                <button onClick={() => go('teamStats')} className="text-[11.5px] text-blue-700 font-medium mt-2 hover:underline">View team stats →</button>
              </div>
            </div>

                  const win = (g.teamScore||0) > (g.oppScore||0);

                      <div className="min-w-0 flex-1">

                          <span className={`text-[12.5px] truncate ${isUnread ? 'font-semibold text-stone-900' : 'font-medium text-stone-700'}`}>{m.from?.name}</span>
                          <span className="text-[10.5px] text-stone-400 shrink-0">{fmtRelative(m.sentAt)}</span>

            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function WLDonut({ wins = 0, losses = 0, size = 84 }) {
  const total = wins + losses;
  const wPct = total ? wins / total : 0;
  const r = size / 2 - 8;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#fee2e2" strokeWidth="10"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#059669" strokeWidth="10"
        strokeDasharray={`${c * wPct} ${c}`} strokeDashoffset={c / 4} transform={`rotate(-90 ${size/2} ${size/2})`} strokeLinecap="round"/>
      <text x={size/2} y={size/2 + 4} textAnchor="middle" fontSize="13" fontWeight="700" fill="#0f172a">{total ? Math.round(wPct*100)+'%' : '—'}</text>
    </svg>
  );
}

function MyProfilePage({ currentUser }) {

  const [editOpen, setEditOpen] = useState(false);
  const [draft, setDraft] = useState(null);

  if (!profiles.loaded) return <div className="flex-1 flex items-center justify-center text-stone-500 text-[13px]">Loading profile…</div>;

  let profile = profiles.items.find(p => p.playerId === currentUser.id);

  // PROF-01: create on first login if missing
  if (!profile) {
    return <ProfileWizard currentUser={currentUser} onCreate={async (data) => {
      const newP = { id: `pp-${currentUser.id}`, playerId: currentUser.id, ...data, verified: false, verifiedBy: null, verifiedAt: null, photoDataUrl: null };
      await profiles.save(newP);
    }}/>;
  }

  const myAttr = attributes.items.find(a => a.playerId === currentUser.id);

  const startEdit = () => { setDraft({ ...profile }); setEditOpen(true); };
  const saveEdit = async () => {
    if (!draft) return;
    // Edits invalidate verification (Coach must re-approve)
    const wasVerified = profile.verified;
    const next = { ...draft };
    if (wasVerified && JSON.stringify({ ...draft, photoDataUrl: undefined }) !== JSON.stringify({ ...profile, photoDataUrl: undefined })) {
      next.verified = false; next.verifiedBy = null; next.verifiedAt = null;
    }
    await profiles.save(next);
    setEditOpen(false);
  };

  const handlePhoto = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      // Downsample by drawing onto a 640px-max canvas
      const img = new Image();
      img.onload = async () => {
        const max = 640;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        await profiles.save({ ...profile, photoDataUrl: dataUrl });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

                  <I.Camera className="w-4.5 h-4.5"/>
                </div>
                <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhoto(e.target.files?.[0])}/>
              </label>
              <div className="mt-4">
                <div className="font-display text-xl font-bold text-stone-900">{profile.fullName}</div>
                <div className="text-[13px] text-stone-500 mt-0.5">#{profile.jerseyNumber} • {profile.position}</div>

              </div>
              {profile.bio && <p className="text-[12.5px] text-stone-600 mt-4 leading-relaxed">{profile.bio}</p>}
            </div>
          </div>
          {/* Personal info */}
          <div className="col-span-12 lg:col-span-8 bg-white rounded-xl border border-stone-200 p-5">

function TeammatesPage({ currentUser, roster }) {

  const [sortBy, setSortBy] = useState('number');

  const rows = useMemo(() => {
    let r = roster.map(p => ({ ...p, profile: profiles.items.find(pp => pp.playerId === p.id) }));
    if (filterPos !== 'all') r = r.filter(x => x.position === filterPos);
    if (query.trim()) {
      const q = query.toLowerCase();
      r = r.filter(x => x.name.toLowerCase().includes(q) || (x.profile?.fullName||'').toLowerCase().includes(q));
    }
    if (sortBy === 'number') r.sort((a,b) => a.number - b.number);
    else if (sortBy === 'name') r.sort((a,b) => a.name.localeCompare(b.name));
    else if (sortBy === 'position') r.sort((a,b) => a.position.localeCompare(b.position));
    return r;

    <div className="flex-1 flex flex-col overflow-hidden">

function MyStatsPage({ currentUser }) {
  const { go } = useRouter();

  const [season, setSeason] = useState('all');

  const seasons = useMemo(() => ['all', ...Array.from(new Set(games.items.map(g => g.season))).filter(Boolean)], [games.items]);

  const enriched = mine.map(s => ({ ...s, game: games.items.find(g => g.id === s.gameId) })).filter(s => s.game);

/* =========================================================================
   TEAM STATS (STAT-07, STAT-08, STAT-09) — read-only leaderboard + W/L
   ========================================================================= */
function TeamStatsPage({ roster }) {
  const { go } = useRouter();
  const stats = useCollection('gameStats', SEED_GAME_STATS);
  const games = useCollection('games', SEED_GAMES);
  const teamStats = useCollection('teamStats', SEED_TEAM_STATS);
  const [season, setSeason] = useState('all');
  const filteredGames = games.items.filter(g => season === 'all' || g.season === season);
  const wins = filteredGames.filter(g => g.status === 'completed' && (g.teamScore||0) > (g.oppScore||0)).length;
  const losses = filteredGames.filter(g => g.status === 'completed' && (g.teamScore||0) < (g.oppScore||0)).length;

  const leaderboards = useMemo(() => {
    const eligibleIds = new Set(filteredGames.map(g => g.id));
    const filteredStats = stats.items.filter(s => eligibleIds.has(s.gameId));
    const cats = [
      { k:'pts', l:'Points' },{ k:'ast', l:'Assists' },{ k:'reb', l:'Rebounds' },
      { k:'stl', l:'Steals' },{ k:'blk', l:'Blocks' },{ k:'min', l:'Minutes' },
    ];
    const out = {};
    for (const c of cats) {
      const tallies = {};
      for (const s of filteredStats) tallies[s.playerId] = (tallies[s.playerId] || 0) + (s[c.k] || 0);
      const ranked = Object.entries(tallies).map(([pid, total]) => {
        const g = filteredStats.filter(s => s.playerId === pid).length || 1;
        return { player: roster.find(r => r.id === pid), avg: total / g, total };
      }).filter(r => r.player).sort((a,b) => b.avg - a.avg);
      out[c.k] = { label: c.l, rows: ranked };
    }
    return out;
  }, [stats.items, filteredGames, roster]);

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <PageHeader title="Team stats" subtitle="Season record, leaderboards, and team averages."/>
      <div className="px-7 py-3 border-b border-stone-200 bg-white flex items-center gap-3">
        <select value={season} onChange={e => setSeason(e.target.value)} className="px-2.5 py-1.5 text-[12.5px] border border-stone-300 rounded-md bg-white">
          <option value="all">All seasons</option>
          {Array.from(new Set(games.items.map(g => g.season))).filter(Boolean).map(s => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      <div className="flex-1 overflow-y-auto p-7">
        <div className="grid grid-cols-12 gap-5 mb-5">
          <div className="col-span-12 md:col-span-4 bg-white border border-stone-200 rounded-xl p-5 flex items-center gap-4">
            <WLDonut wins={wins} losses={losses} size={96}/>
            <div>
              <div className="text-[10.5px] font-semibold text-stone-500 uppercase tracking-wider">Record</div>
              <div className="font-display text-3xl font-bold text-stone-900">{wins}-{losses}</div>
              <div className="text-[12px] text-stone-500">{wins + losses ? Math.round(wins/(wins+losses)*100) : 0}% win rate</div>
            </div>
          </div>
          <div className="col-span-12 md:col-span-8 bg-white border border-stone-200 rounded-xl p-5">
            <div className="font-display text-[14px] font-semibold text-stone-900 mb-3">Team averages</div>
            <div className="grid grid-cols-4 gap-3">
              {(() => {
                const filteredIds = new Set(filteredGames.map(g => g.id));
                const ts = teamStats.items.filter(t => filteredIds.has(t.gameId));
                const avg = (k) => ts.length ? (ts.reduce((a,t) => a + (t[k]||0), 0) / ts.length).toFixed(1) : '—';
                return [
                  { l:'FG%', v: avg('fgPct') },{ l:'3P%', v: avg('tpPct') },
                  { l:'FT%', v: avg('ftPct') },{ l:'Reb', v: avg('reb') },
                  { l:'Ast', v: avg('ast') },{ l:'TOV', v: avg('tov') },
                  { l:'Stl', v: avg('stl') },{ l:'Blk', v: avg('blk') },
                ].map(t => (
                  <div key={t.l} className="bg-stone-50 border border-stone-200 rounded-lg px-3 py-2">
                    <div className="text-[10px] font-semibold text-stone-500 uppercase">{t.l}</div>
                    <div className="font-display text-base font-bold text-stone-900">{t.v}</div>
                  </div>
                ));
              })()}
            </div>
          </div>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {Object.entries(leaderboards).map(([k, lb]) => (
            <div key={k} className="bg-white border border-stone-200 rounded-xl p-4">
              <div className="flex items-center gap-2 mb-2">
                <I.Trophy className="w-4 h-4 text-amber-500"/>
                <div className="font-display text-[14px] font-semibold text-stone-900">{lb.label}</div>
              </div>
              <ol className="space-y-1">
                {lb.rows.slice(0, 5).map((r, i) => (
                  <li key={r.player.id}>
                    <button onClick={() => go('teammate', { playerId: r.player.id })} className="w-full flex items-center gap-2 px-1.5 py-1 rounded hover:bg-stone-50 text-left">
                      <span className="text-[11px] font-mono text-stone-400 w-4">{i+1}</span>
                      <span className="text-[12.5px] font-mono text-blue-700 w-7">#{r.player.number}</span>
                      <span className="text-[12.5px] text-stone-800 truncate flex-1">{r.player.name}</span>
                      <span className="text-[12.5px] font-mono font-semibold text-stone-900">{r.avg.toFixed(1)}</span>
                    </button>
                  </li>
                ))}
              </ol>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function PlayDetailPage() {
  const { params, go } = useRouter();
  const plays = useCollection('plays', SEED_PLAYS);
  const play = plays.items.find(p => p.id === params.playId);
  const [phaseIdx, setPhaseIdx] = useState(0);
  if (!play) return <div className="flex-1 flex items-center justify-center text-stone-500">Play not found.</div>;
  // Fallback shape: coach module may store `positions` + `drawings` at the top
  // level with no `phases[]`. Synthesize a single-phase view in that case.
  const phases = (play.phases && play.phases.length > 0)
    ? play.phases
    : [{ id:'ph-0', label:'Setup', positions: play.positions || {}, drawings: play.drawings || [] }];
  const phase = phases[phaseIdx] || phases[0];
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <PageHeader title={play.name}
        subtitle={`${(play.side || 'offense') === 'offense' ? 'Offense' : 'Defense'} • ${play.category || 'Set Play'}${play.sharedBy ? ' • shared by ' + play.sharedBy : ''}`}
        actions={<button onClick={() => go('plays')} className="text-[12.5px] text-stone-700 hover:text-stone-900 flex items-center gap-1"><I.ChevronL className="w-4 h-4"/>All plays</button>}/>
      <div className="flex-1 overflow-y-auto p-7">
        <div className="grid grid-cols-12 gap-5">
          <div className="col-span-12 lg:col-span-8 bg-white border border-stone-200 rounded-xl p-4">
            <div className="flex items-center justify-between mb-2">
              <div className="font-display text-[14px] font-semibold text-stone-900">Phase {phaseIdx + 1}: {phase.label}</div>
              <div className="flex items-center gap-2">
                <button onClick={() => setPhaseIdx(i => Math.max(0, i - 1))} disabled={phaseIdx === 0}
                  className="px-2 py-1 text-[12px] font-semibold border border-stone-300 rounded disabled:opacity-40 hover:bg-stone-50"><I.ChevronL className="w-4 h-4"/></button>
                <button onClick={() => setPhaseIdx(i => Math.min(phases.length - 1, i + 1))} disabled={phaseIdx >= phases.length - 1}
                  className="px-2 py-1 text-[12px] font-semibold border border-stone-300 rounded disabled:opacity-40 hover:bg-stone-50"><I.ChevronR className="w-4 h-4"/></button>
              </div>
            </div>
            <CourtView positions={phase.positions} drawings={phase.drawings} height={460}/>
            <div className="mt-3 flex items-center gap-2 flex-wrap">
              {phases.map((ph, i) => (
                <button key={ph.id || i} onClick={() => setPhaseIdx(i)}
                  className={`px-3 py-1 text-[12px] rounded-full font-semibold ${i === phaseIdx ? 'bg-blue-600 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}`}>
                  {i+1}. {ph.label}
                </button>
              ))}
            </div>
          </div>
          <div className="col-span-12 lg:col-span-4 space-y-4">
            <div className="bg-white border border-stone-200 rounded-xl p-4">
              <div className="font-display text-[14px] font-semibold text-stone-900 mb-2">Description</div>
              <p className="text-[12.5px] text-stone-700 leading-relaxed">{play.description}</p>
            </div>
            <div className="bg-white border border-stone-200 rounded-xl p-4">
              <div className="font-display text-[13px] font-semibold text-stone-900 mb-2">Legend</div>
              <div className="space-y-1.5 text-[12px]">
                <Legend color="#0f172a" dash="6 4" label="Pass"/>
                <Legend color="#0d9488" dash="2 3" label="Dribble"/>
                <Legend color="#1e40af" dash="0" label="Cut / movement"/>
                <Legend color="#dc2626" dash="0" label="Screen"/>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
function Legend({ color, dash, label }) {

}

/* =========================================================================

   ========================================================================= */
function RotationsPage({ currentUser, roster }) {
  const { params, go } = useRouter();
  const games = useCollection('games', SEED_GAMES);
  const rotations = useCollection('rotations', SEED_ROTATIONS);
  const upcoming = games.items.filter(g => g.status === 'scheduled').sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const [selectedId, setSelectedId] = useState(params?.gameId || upcoming[0]?.id || rotations.items[0]?.gameId);
  useEffect(() => {
    if (!selectedId && rotations.items.length > 0) setSelectedId(rotations.items[0].gameId);
  }, [rotations.items, selectedId]);
  const rot = rotations.items.find(r => r.gameId === selectedId);
  const game = games.items.find(g => g.id === selectedId);
  const mine = rot?.players?.find(p => p.playerId === currentUser.id);
  const subFor = mine?.subFor ? roster.find(r => r.id === mine.subFor) : null;

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <PageHeader title="Rotations" subtitle="Your assigned minutes per game."/>
      <div className="px-7 py-3 border-b border-stone-200 bg-white flex items-center gap-3">
        <select value={selectedId || ''} onChange={e => setSelectedId(e.target.value)} className="px-2.5 py-1.5 text-[12.5px] border border-stone-300 rounded-md bg-white">
          {rotations.items.map(r => {
            const g = games.items.find(gg => gg.id === r.gameId); if (!g) return null;
            return <option key={r.gameId} value={r.gameId}>{g.date} • {g.homeAway === 'home' ? 'vs' : '@'} {g.opponent}</option>;
          })}
        </select>
      </div>
      <div className="flex-1 overflow-y-auto p-7">
        {!rot || !game ? <div className="text-stone-500 text-[13px]">No rotation set for the selected game.</div> : (
          <div className="grid grid-cols-12 gap-5">
            <div className="col-span-12 lg:col-span-4 bg-white border border-stone-200 rounded-xl p-5">
              <div className="text-[11px] font-semibold text-stone-500 uppercase">Your assignment</div>
              <div className="font-display text-[26px] font-bold text-stone-900 mt-1">{mine?.mins ?? '—'} <span className="text-stone-400 text-[14px] font-normal">min</span></div>
              <div className="mt-2 text-[12.5px] text-stone-700">
                Role: <span className={`font-semibold ${mine?.role === 'Starter' ? 'text-emerald-700' : 'text-blue-700'}`}>{mine?.role || '—'}</span>
              </div>
              {subFor && <div className="text-[12.5px] text-stone-700 mt-1">Sub for: <span className="font-semibold">#{subFor.number} {subFor.name}</span></div>}
              {!mine && <div className="text-[12.5px] text-stone-500 mt-2">You are not in the rotation for this game.</div>}
              {rot.notes && (
                <div className="mt-4 pt-4 border-t border-stone-100">
                  <div className="text-[10.5px] font-semibold text-stone-500 uppercase mb-1">Coach notes</div>
                  <p className="text-[12.5px] text-stone-700 leading-relaxed">{rot.notes}</p>
                </div>
              )}
            </div>
            <div className="col-span-12 lg:col-span-8 bg-white border border-stone-200 rounded-xl p-5">
              <div className="font-display text-[14px] font-semibold text-stone-900 mb-3">Full rotation — {game.opponent}</div>
              <table className="w-full text-[12.5px]">
                <thead><tr className="text-stone-500 text-[10px] uppercase border-b border-stone-100">
                  <th className="text-left py-1 font-semibold">#</th>
                  <th className="text-left font-semibold">Player</th>
                  <th className="text-left font-semibold">Role</th>
                  <th className="text-right font-semibold">MIN</th>
                  <th className="text-left font-semibold pl-3">Sub for</th>
                </tr></thead>
                <tbody>
                  {(rot.players || []).map(rp => {
                    const p = roster.find(r => r.id === rp.playerId); if (!p) return null;
                    const me = rp.playerId === currentUser.id;
                    const sf = rp.subFor ? roster.find(r => r.id === rp.subFor) : null;
                    return (
                      <tr key={rp.playerId} className={`border-t border-stone-50 ${me ? 'bg-blue-50/50' : ''}`}>

                        <td className={me ? 'text-blue-700 font-semibold' : 'text-stone-800'}>{p.name}</td>

                        <td className="text-right font-mono font-semibold">{rp.mins}</td>
                        <td className="pl-3 text-stone-600">{sf ? `#${sf.number} ${sf.name}` : '—'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* =========================================================================
   MESSAGES (MSG-06..11) — inbox, threads, compose
   ========================================================================= */
function MessagesPage({ currentUser, roster }) {
  const { params, go } = useRouter();
  const messages = useCollection('messages', SEED_MESSAGES);
  const [composeOpen, setComposeOpen] = useState(false);
  const [activeId, setActiveId] = useState(params?.messageId || null);

  // Filter inbox: I receive team announcements + DMs to me. Also include
  // DMs *from* me (sent items combined into the same list).
  const inbox = useMemo(() => {
    const list = messages.items.filter(m => {
      if (m.from?.userId === currentUser.id) return false; // sent — separate
      return m.to?.scope === 'team' || (m.to?.scope === 'player' && m.to?.playerId === currentUser.id);
    });
    return list.sort((a,b) => (b.sentAt||0) - (a.sentAt||0));
  }, [messages.items, currentUser.id]);

  const sent = useMemo(() =>
    messages.items.filter(m => m.from?.userId === currentUser.id).sort((a,b) => (b.sentAt||0) - (a.sentAt||0)),
    [messages.items, currentUser.id]
  );

  const [tab, setTab] = useState('inbox');
  const active = inbox.concat(sent).find(m => m.id === activeId) || inbox[0];

  // Mark as read on open
  useEffect(() => {
    if (active && active.from?.userId !== currentUser.id) {
      if (!(active.readBy && active.readBy[currentUser.id])) {
        const next = { ...active, readBy: { ...(active.readBy||{}), [currentUser.id]: Date.now() } };
        messages.save(next);
      }
    }
  }, [active?.id]);

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <PageHeader title="Messages" subtitle="Your messages."
        actions={
          <button onClick={() => setComposeOpen(true)} className="px-3.5 py-2 text-[12.5px] font-semibold rounded-md bg-blue-600 text-white hover:bg-blue-700 btn-press flex items-center gap-1.5">
            <I.Plus className="w-4 h-4"/> Compose
          </button>
        }/>
      <div className="flex-1 overflow-hidden flex">
        {/* List */}
        <div className="w-80 border-r border-stone-200 flex flex-col bg-white">
          <div className="flex border-b border-stone-200">
            {[['inbox','Inbox'],['sent','Sent']].map(([id,label]) => (
              <button key={id} onClick={() => setTab(id)}
                className={`flex-1 py-2.5 text-[12.5px] font-semibold ${tab === id ? 'text-blue-700 border-b-2 border-blue-600' : 'text-stone-500 border-b-2 border-transparent hover:text-stone-800'}`}>
                {label} {id === 'inbox' && inbox.filter(m => !(m.readBy && m.readBy[currentUser.id])).length > 0 && (
                  <span className="ml-1 min-w-[16px] h-[16px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold inline-flex items-center justify-center">
                    {inbox.filter(m => !(m.readBy && m.readBy[currentUser.id])).length}
                  </span>
                )}
              </button>
            ))}
          </div>
          <div className="flex-1 overflow-y-auto">
            {(tab === 'inbox' ? inbox : sent).map(m => {
              const isUnread = tab === 'inbox' && !(m.readBy && m.readBy[currentUser.id]);
              return (
                <button key={m.id} onClick={() => setActiveId(m.id)}
                  className={`w-full text-left px-4 py-2.5 border-b border-stone-100 hover:bg-stone-50 ${active?.id === m.id ? 'bg-blue-50/60' : ''}`}>
                  <div className="flex items-start gap-2">
                    <div className={`w-1.5 h-1.5 rounded-full mt-2 shrink-0 ${isUnread ? 'bg-blue-500' : 'bg-transparent'}`}/>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-baseline justify-between gap-2">
                        <span className={`text-[12.5px] truncate ${isUnread ? 'font-semibold text-stone-900' : 'font-medium text-stone-700'}`}>
                          {tab === 'inbox' ? m.from?.name : (m.to?.scope === 'team' ? 'Team announcement' : roster.find(r => r.id === m.to?.playerId)?.name || 'Direct')}
                        </span>
                        <span className="text-[10.5px] text-stone-400 shrink-0">{fmtRelative(m.sentAt)}</span>
                      </div>
                      <div className={`text-[12px] truncate ${isUnread ? 'text-stone-800 font-medium' : 'text-stone-600'}`}>{m.subject}</div>
                    </div>
                  </div>
                </button>
              );
            })}
            {(tab === 'inbox' ? inbox : sent).length === 0 && <div className="text-center text-stone-500 py-8 text-[12.5px]">No messages.</div>}
          </div>
        </div>
        {/* Detail */}
        <div className="flex-1 overflow-y-auto bg-stone-50/50 p-7">
          {active ? (
            <div className="max-w-2xl mx-auto bg-white border border-stone-200 rounded-xl p-6">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[10.5px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-stone-100 text-stone-700">
                  {active.kind === 'announcement' ? 'Team announcement' : 'Direct'}
                </span>
                <span className="text-[11.5px] text-stone-500">{new Date(active.sentAt).toLocaleString()}</span>
              </div>
              <h2 className="font-display text-xl font-bold text-stone-900 mt-2">{active.subject}</h2>
              <div className="mt-1 text-[12.5px] text-stone-600">
                From <span className="font-semibold">{active.from?.name}</span> ({active.from?.role})
                {active.to?.scope === 'player' && active.to?.playerId !== currentUser.id && (
                  <> • To {roster.find(r => r.id === active.to.playerId)?.name}</>
                )}
              </div>
              <p className="text-[14px] text-stone-800 mt-4 whitespace-pre-wrap leading-relaxed">{active.body}</p>
            </div>
          ) : (
            <div className="text-center text-stone-500 py-12 text-[13px]">Select a message to read.</div>
          )}
        </div>
      </div>
      <ComposeModal open={composeOpen} onClose={() => setComposeOpen(false)} currentUser={currentUser} roster={roster}
        onSend={async (msg) => { await messages.save(msg); setComposeOpen(false); setActiveId(msg.id); setTab('sent'); }}/>
    </div>
  );
}

function ComposeModal({ open, onClose, currentUser, roster, onSend }) {
  const [recipient, setRecipient] = useState('coach');
  const [teammateId, setTeammateId] = useState('');
  const [subject, setSubject] = useState('');
  const [body, setBody] = useState('');
  useEffect(() => { if (open) { setRecipient('coach'); setTeammateId(''); setSubject(''); setBody(''); } }, [open]);

  const can = subject.trim() && body.trim() && (recipient !== 'teammate' || teammateId);

  const send = () => {
    let to;
    if (recipient === 'coach') to = { scope:'role', role:'coach' };
    else if (recipient === 'trainer') to = { scope:'role', role:'trainer' };
    else to = { scope:'player', playerId: teammateId };
    const msg = {
      id: newId('msg'),
      from: { role:'player', name: currentUser.name, userId: currentUser.id },
      to, kind:'direct', subject, body,
      sentAt: Date.now(), readBy: {}, threadId: newId('th'),
    };
    onSend(msg);
  };

  return (
    <Modal open={open} onClose={onClose} title="New message" subtitle="Send a message to your coach, trainer, or a teammate." size="lg"
      footer={<>
        <button onClick={onClose} className="px-3.5 py-2 text-[13px] font-medium text-stone-700 hover:bg-stone-100 rounded-md btn-press">Cancel</button>
        <button disabled={!can} onClick={send}
          className="px-3.5 py-2 text-[13px] font-semibold rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-stone-300 btn-press flex items-center gap-1.5">
          <I.Send className="w-4 h-4"/> Send
        </button>
      </>}>
      <SelectField label="Recipient" value={recipient} onChange={setRecipient}
        options={[
          { value:'coach', label:'Coach' },
          { value:'trainer', label:'Trainer' },
          { value:'teammate', label:'Teammate' },
        ]}/>
      {recipient === 'teammate' && (
        <SelectField label="Teammate" value={teammateId} onChange={setTeammateId}
          options={[{ value:'', label:'— select teammate —' }, ...roster.filter(r => r.id !== currentUser.id).map(r => ({ value: r.id, label: `#${r.number} ${r.name}` }))]}/>
      )}
      <TextField label="Subject" value={subject} onChange={setSubject} required/>
      <TextArea label="Message" value={body} onChange={setBody} rows={6}/>
    </Modal>
  );
}

/* =========================================================================
   ROOT
   ========================================================================= */
function App() {

  const roster = useCollection('roster', SEED_ROSTER);
  const [role, , roleLoaded] = useStored('currentUser:role', null);
  const [currentUserId] = useStored('currentUser:playerId', null);
  const [collapsed, setCollapsed] = useStored('ui:sidebarCollapsed', false);
  const [routeState, setRouteState] = useState({ route: 'dashboard', params: {} });
  const messages = useCollection('messages', SEED_MESSAGES);

  if (!roster.loaded || !roleLoaded) {
    return <div className="h-full flex items-center justify-center text-stone-500 text-[13px]">Loading…</div>;
  }

  // AUTH-02 role gate: identity comes from login.html.
  if (role !== 'player' || !currentUserId) {
    return <RoleGateScreen role={role}/>;
  }
  const currentUser = roster.items.find(r => r.id === currentUserId);
  if (!currentUser) return <RoleGateScreen role={role}/>;

  // Unread count for the logged-in player.
  const unreadCount = messages.items.filter(m => {
    if (!m) return false;
    if (m.from?.userId === currentUser.id) return false;
    const isMine = (m.to?.scope === 'team') || (m.to?.scope === 'player' && m.to?.playerId === currentUser.id);
    if (!isMine) return false;
    return !(m.readBy && m.readBy[currentUser.id]);
  }).length;

  const go = (route, params = {}) => setRouteState({ route, params });
  const PageComp = ROUTES[routeState.route]?.component || NotFoundPage;

  const signOut = async () => {
    if (window.cs_auth) await window.cs_auth.logout();
    else {
      await Storage.delete('currentUser:role');
      await Storage.delete('currentUser:name');
      await Storage.delete('currentUser:playerId');
    }
    window.location.href = 'login.html';
  };

  return (
    <RouterCtx.Provider value={{ route: routeState.route, params: routeState.params, go }}>
      <div className="h-full flex">
        <Sidebar
          active={routeState.route}
          onSelect={(id) => go(id)}
          collapsed={collapsed}
          onToggleCollapse={() => setCollapsed(c => !c)}
          unreadCount={unreadCount}
          currentUser={currentUser}
          onLogout={signOut}
        />
        <main className="flex-1 h-full overflow-hidden flex flex-col canvas-bg">
          <PageComp currentUser={currentUser} roster={roster.items}/>
        </main>
      </div>
    </RouterCtx.Provider>
  );
}

function NotFoundPage() {
  const { go } = useRouter();
  return (
    <div className="flex-1 flex items-center justify-center">
      <div className="text-center">
        <div className="text-stone-500 mb-2">Route not found.</div>
        <button onClick={() => go('dashboard')} className="text-blue-700 underline text-[13px]">Back to dashboard</button>
      </div>
    </div>
  );
}


/* ============================================================
   Root wrapper — performs the active session check BEFORE App
   mounts, so React never sees hook-count mismatches between an
   early return and the post-verification render.
   ============================================================ */
function Root() {
  const [__sessionChecked, __setSessionChecked] = useState(false);
  const [__sessionUser, __setSessionUser] = useState(null);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (window.cs_auth) {
        const u = await window.cs_auth.requireSession('player');
        if (cancelled) return;
        __setSessionUser(u);
      } else {
        __setSessionUser({ role: 'player' });
      }
      if (!cancelled) __setSessionChecked(true);
    })();
    return () => { cancelled = true; };
  }, []);
  if (!__sessionChecked) {
    return (
      <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'#f8f6f3', color:'#78716c', fontSize:'13px', fontFamily:"'Plus Jakarta Sans', system-ui, sans-serif" }}>
        Verifying session…
      </div>
    );
  }
  if (!__sessionUser) return null;
  return <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
