/* =========================================================================
   STORAGE + HOOKS — shared with all other modules
   ========================================================================= */
const Storage = {
  async get(k){ if(!window.storage) return null; try { const r = await window.storage.get(k); return r?.value ? JSON.parse(r.value) : null; } catch { return null; } },
  async set(k,v){ if(!window.storage) return false; try { await window.storage.set(k, JSON.stringify(v)); return true; } catch { return false; } },
  async delete(k){ if(!window.storage) return false; try { await window.storage.delete(k); return true; } catch { return false; } },
  async list(p){ if(!window.storage) return []; try { const r = await window.storage.list(p); return r?.keys || []; } catch { return []; } },
};
if (typeof window !== 'undefined' && !window.storage) {
  const mem = {};
  window.storage = {
    async get(k){ if(!(k in mem)) throw new Error('not found'); return { value: mem[k] }; },
    async set(k,v){ mem[k] = v; return true; },
    async delete(k){ delete mem[k]; return true; },
    async list(p){ return { keys: Object.keys(mem).filter(k => k.startsWith(p)) }; },
  };
}

function useCollection(prefix, defaults = []) {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const keys = await Storage.list(`${prefix}:`);
      const seeded = await Storage.get(`${prefix}:__seeded`);
      const itemKeys = keys.filter((k) => !k.endsWith(':__seeded'));
      const all = await Promise.all(itemKeys.map((k) => Storage.get(k)));
      const valid = all.filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      if (!seeded && valid.length === 0 && defaults.length > 0) {
        await Storage.set(`${prefix}:__seeded`, true);
        for (const d of defaults) await Storage.set(`${prefix}:${d.id}`, { ...d, updatedAt: d.updatedAt || Date.now() });
        if (!cancelled) setItems([...defaults]);
      } else if (!cancelled) setItems(valid);
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [prefix]);
  const save = useCallback(async (item) => {
    const id = item.id || `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
    const next = { ...item, id, updatedAt: Date.now() };
    await Storage.set(`${prefix}:${id}`, next);
    setItems(prev => { const idx = prev.findIndex(p => p.id === id); if (idx === -1) return [next, ...prev]; const arr = [...prev]; arr[idx] = next; return arr; });
    return next;
  }, [prefix]);
  const remove = useCallback(async (id) => {
    await Storage.delete(`${prefix}:${id}`);
    setItems(prev => prev.filter(p => p.id !== id));
  }, [prefix]);
  return { items, save, remove, loaded };
}
function useStored(key, initial) {
  const [value, setValue] = useState(initial);
  useEffect(() => { let c=false; (async () => { const v = await Storage.get(key); if (v !== null && !c) setValue(v); })(); return () => { c = true; }; }, [key]);
  const set = useCallback(v => setValue(prev => { const n = typeof v === 'function' ? v(prev) : v; Storage.set(key, n); return n; }), [key]);
  return [value, set];
}

const newId = (p) => `${p}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
function fmtRel(ts){ if(!ts) return '—'; const s=Math.round((Date.now()-ts)/1000); if(s<60) return s+'s ago'; const m=Math.round(s/60); if(m<60) return m+'m ago'; const h=Math.round(m/60); if(h<24) return h+'h ago'; const d=Math.round(h/24); if(d<30) return d+'d ago'; return new Date(ts).toLocaleDateString(); }
function fmtDate(s){ if (!s) return '—'; const d = new Date(s); return isNaN(d.getTime()) ? s : d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }); }

}

function useRoleGate(expected) {

/* =========================================================================
   ATTRIBUTES PAGE (ATTR-01..03) — entry + history grid
   ========================================================================= */
function AttributesPage({ roster }) {
  const { params, go } = useRouter();
  const attrs = useCollection('attributes', SEED_ATTRIBUTES);
  const [editing, setEditing] = useState(null);

  useEffect(() => {
    if (params?.playerId) {
      const existing = attrs.items.find(a => a.playerId === params.playerId);
      if (params.create || !existing) {
        setEditing({ id:null, playerId: params.playerId, recordedBy: TRAINER.name, recordedAt: Date.now(),
          heightCm:180, weightKg:80, bodyFatPct:10, wingspanCm:188, verticalInches:30, fortyYdSec:4.8, benchMax:155, squatMax:225, history: [] });
      } else {
        setEditing({ ...existing });
      }
    }
  }, [params?.playerId, params?.create, attrs.items.length]);

  const save = async () => {
    if (!editing) return;
    const existing = attrs.items.find(a => a.playerId === editing.playerId);
    const newRow = { date: new Date().toISOString().slice(0,10), heightCm: editing.heightCm, weightKg: editing.weightKg, bodyFatPct: editing.bodyFatPct, verticalInches: editing.verticalInches, recordedBy: TRAINER.name };
    const prevHistory = existing?.history || [];
    const next = { ...editing,
      id: editing.id || `at-${editing.playerId}`,
      recordedAt: Date.now(),
      recordedBy: TRAINER.name,
      history: [...prevHistory.filter(h => h.date !== newRow.date), newRow].sort((a,b) => a.date.localeCompare(b.date)),
    };
    await attrs.save(next);
    setEditing(null);
    go('attributes');
  };

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <PageHeader title="Physical attributes" subtitle="Record and review athlete attributes."/>
      <div className="flex-1 overflow-y-auto p-7">
        <div className="bg-white border border-stone-200 rounded-xl overflow-hidden">
          <table className="w-full text-[13px]">
            <thead><tr className="text-stone-500 text-[10.5px] uppercase tracking-wider border-b border-stone-200 bg-stone-50">
              <th className="text-left py-2.5 px-4 font-semibold">Athlete</th>
              <th className="text-right font-semibold">Ht (cm)</th>
              <th className="text-right font-semibold">Wt (kg)</th>
              <th className="text-right font-semibold">BF %</th>
              <th className="text-right font-semibold">Vert "</th>
              <th className="text-right font-semibold">40 yd</th>
              <th className="text-right font-semibold">Updated</th>
              <th className="text-right font-semibold px-4">Action</th>
            </tr></thead>
            <tbody>
              {roster.sort((a,b) => a.number - b.number).map(p => {
                const a = attrs.items.find(x => x.playerId === p.id);
                return (
                  <tr key={p.id} className="border-t border-stone-100 hover:bg-stone-50">
                    <td className="py-2 px-4 font-semibold text-stone-900">#{p.number} {p.name}</td>
                    <td className="text-right font-mono">{a?.heightCm ?? '—'}</td>
                    <td className="text-right font-mono">{a?.weightKg ?? '—'}</td>
                    <td className="text-right font-mono">{a?.bodyFatPct ?? '—'}</td>
                    <td className="text-right font-mono">{a?.verticalInches ?? '—'}</td>
                    <td className="text-right font-mono">{a?.fortyYdSec?.toFixed(2) ?? '—'}</td>
                    <td className="text-right text-stone-500 text-[11.5px]">{a ? fmtRel(a.recordedAt) : '—'}</td>
                    <td className="text-right px-4">
                      <button onClick={() => setEditing(a ? { ...a } : { id:null, playerId: p.id, recordedBy: TRAINER.name, heightCm:180, weightKg:80, bodyFatPct:10, wingspanCm:188, verticalInches:30, fortyYdSec:4.8, benchMax:155, squatMax:225, history:[] })}
                        className="text-[12px] font-semibold text-amber-700 hover:underline">{a ? 'Edit' : 'Record'}</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <Modal open={!!editing} onClose={() => setEditing(null)}
        title={editing?.id ? 'Edit attributes' : 'Record attributes'}
        subtitle={editing ? `${(roster.find(r => r.id === editing.playerId)||{}).name} — physical attributes` : ''}
        size="lg" footer={<>
          <button onClick={() => setEditing(null)} className="px-3.5 py-2 text-[13px] font-medium text-stone-700 hover:bg-stone-100 rounded-md btn-press">Cancel</button>
          <button onClick={save} className="px-3.5 py-2 text-[13px] font-semibold text-white rounded-md bg-amber-600 hover:bg-amber-700 btn-press">Save</button>
        </>}>
        {editing && (
          <div className="grid grid-cols-2 gap-x-4">
            <NumberField label="Height (cm)" value={editing.heightCm} onChange={v => setEditing({...editing, heightCm:v})} min={100} max={250}/>
            <NumberField label="Weight (kg)" value={editing.weightKg} onChange={v => setEditing({...editing, weightKg:v})} min={30} max={200}/>
            <NumberField label="Body fat (%)" value={editing.bodyFatPct} onChange={v => setEditing({...editing, bodyFatPct:v})} min={0} max={50}/>
            <NumberField label="Wingspan (cm)" value={editing.wingspanCm} onChange={v => setEditing({...editing, wingspanCm:v})} min={100} max={250}/>
            <NumberField label="Vertical (in)" value={editing.verticalInches} onChange={v => setEditing({...editing, verticalInches:v})} min={0} max={60}/>
            <NumberField label="40 yd (s)" value={editing.fortyYdSec} onChange={v => setEditing({...editing, fortyYdSec:v})} step="0.01" min={4} max={7}/>
            <NumberField label="Bench max (lb)" value={editing.benchMax} onChange={v => setEditing({...editing, benchMax:v})} min={0}/>
            <NumberField label="Squat max (lb)" value={editing.squatMax} onChange={v => setEditing({...editing, squatMax:v})} min={0}/>
          </div>
        )}
      </Modal>
    </div>
  );
}

function WorkoutEditor({ open, draft, setDraft, roster, exercises, onSave, onCancel }) {
  if (!draft) return null;
  const addBlock = () => setDraft({ ...draft, blocks: [...draft.blocks, { name:`Block ${draft.blocks.length+1}`, exercises:[] }] });
  const updBlock = (i, b) => setDraft({ ...draft, blocks: draft.blocks.map((x,j) => j === i ? b : x) });
  const rmBlock = (i) => setDraft({ ...draft, blocks: draft.blocks.filter((_,j) => j !== i) });
  const addEx = (i) => updBlock(i, { ...draft.blocks[i], exercises: [...draft.blocks[i].exercises, { exId: exercises[0]?.id || '', sets: 3, reps: '10' }] });
  const updEx = (bi, ei, e) => updBlock(bi, { ...draft.blocks[bi], exercises: draft.blocks[bi].exercises.map((x,j) => j === ei ? e : x) });
  const rmEx = (bi, ei) => updBlock(bi, { ...draft.blocks[bi], exercises: draft.blocks[bi].exercises.filter((_,j) => j !== ei) });
  return (
    <Modal open={open} onClose={onCancel} title={draft.id ? 'Edit workout' : 'New workout'} size="xl"
      subtitle="Build a workout plan and assign it." footer={<>
        <button onClick={onCancel} className="px-3.5 py-2 text-[13px] font-medium text-stone-700 hover:bg-stone-100 rounded-md btn-press">Cancel</button>
        <button onClick={onSave} className="px-3.5 py-2 text-[13px] font-semibold text-white rounded-md bg-amber-600 hover:bg-amber-700 btn-press">Save & assign</button>
      </>}>
      <div className="grid grid-cols-2 gap-x-4">
        <SelectField label="Assign to (WRK-04)" value={draft.playerId} onChange={v => setDraft({...draft, playerId:v})}
          options={[{ value:'', label:'— pick athlete —' }, ...roster.map(r => ({ value:r.id, label:`#${r.number} ${r.name}` }))]}/>
        <TextField label="Title" value={draft.title} onChange={v => setDraft({...draft, title:v})} required/>
        <TextField label="Focus" value={draft.focus} onChange={v => setDraft({...draft, focus:v})} placeholder="e.g. lower-body power"/>
        <SelectField label="Status" value={draft.status} onChange={v => setDraft({...draft, status:v})}
          options={[{value:'active',label:'Active'},{value:'archived',label:'Archived'}]}/>
      </div>
      <div className="mt-4 pt-4 border-t border-stone-200">
        <div className="flex items-center justify-between mb-3">
          <div className="font-display text-[14px] font-semibold text-stone-900">Blocks</div>
          <button onClick={addBlock} className="text-[12px] font-semibold text-amber-700 hover:underline">+ Add block</button>
        </div>
        <div className="space-y-3">
          {draft.blocks.map((b, bi) => (
            <div key={bi} className="border border-stone-200 rounded-lg">
              <div className="px-3 py-2 bg-stone-50 border-b border-stone-200 flex items-center gap-2">
                <input value={b.name} onChange={e => updBlock(bi, { ...b, name: e.target.value })}
                  className="flex-1 px-2 py-1 text-[12.5px] font-semibold border border-stone-200 rounded bg-white focus:outline-none focus:ring-1 focus:ring-amber-500"/>
                <button onClick={() => rmBlock(bi)} className="text-stone-400 hover:text-red-600"><I.Trash className="w-4 h-4"/></button>
              </div>
              <div className="p-3 space-y-1.5">
                {b.exercises.map((ex, ei) => (
                  <div key={ei} className="grid grid-cols-12 gap-2 items-center">
                    <select value={ex.exId} onChange={e => updEx(bi, ei, { ...ex, exId: e.target.value })}
                      className="col-span-6 px-2 py-1 text-[12px] border border-stone-300 rounded bg-white">
                      {exercises.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
                    </select>
                    <input type="number" value={ex.sets} onChange={e => updEx(bi, ei, { ...ex, sets: Number(e.target.value)||0 })} placeholder="sets"
                      className="col-span-2 px-2 py-1 text-[12px] text-right font-mono border border-stone-300 rounded"/>
                    <input value={ex.reps} onChange={e => updEx(bi, ei, { ...ex, reps: e.target.value })} placeholder="reps"
                      className="col-span-3 px-2 py-1 text-[12px] font-mono border border-stone-300 rounded"/>
                    <button onClick={() => rmEx(bi, ei)} className="col-span-1 text-stone-400 hover:text-red-600"><I.Close className="w-4 h-4"/></button>
                  </div>
                ))}
                <button onClick={() => addEx(bi)} className="text-[11.5px] text-amber-700 font-semibold mt-1.5 hover:underline">+ Add exercise</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </Modal>
  );
}

            </div>

/* =========================================================================
   MESSAGES (MSG-04/05/09..11)
   ========================================================================= */
function MessagesPage({ roster }) {
  const { params } = useRouter();
  const messages = useCollection('messages', []);
  const [tab, setTab] = useState('inbox');
  const [activeId, setActiveId] = useState(params?.messageId || null);
  const [composeOpen, setComposeOpen] = useState(false);
  const TRAINER_ID = 'trainer-1';

  const inbox = useMemo(() => messages.items.filter(m => {
    if (m.from?.userId === TRAINER_ID) return false;
    return (m.to?.scope === 'role' && m.to?.role === 'trainer') || (m.to?.scope === 'player');
  }).sort((a,b) => (b.sentAt||0) - (a.sentAt||0)), [messages.items]);

  const sent = useMemo(() => messages.items.filter(m => m.from?.userId === TRAINER_ID).sort((a,b) => (b.sentAt||0) - (a.sentAt||0)), [messages.items]);

  const list = tab === 'inbox' ? inbox : sent;
  const active = list.find(m => m.id === activeId) || list[0];

  useEffect(() => {
    if (active && tab === 'inbox' && active.from?.userId !== TRAINER_ID) {
      if (!(active.readBy && active.readBy[TRAINER_ID])) {
        messages.save({ ...active, readBy: { ...(active.readBy||{}), [TRAINER_ID]: Date.now() } });
      }
    }
  }, [active?.id]);

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <PageHeader title="Messages" subtitle="Your messages."
        actions={<button onClick={() => setComposeOpen(true)} className="px-3.5 py-2 text-[12.5px] font-semibold rounded-md bg-amber-600 text-white hover:bg-amber-700 btn-press flex items-center gap-1.5"><I.Plus className="w-4 h-4"/>Compose</button>}/>
      <div className="flex-1 flex overflow-hidden">
        <div className="w-80 border-r border-stone-200 flex flex-col bg-white">
          <div className="flex border-b border-stone-200">
            {[['inbox','Inbox'],['sent','Sent']].map(([id,l]) => (
              <button key={id} onClick={() => setTab(id)}
                className={`flex-1 py-2.5 text-[12.5px] font-semibold ${tab === id ? 'text-amber-700 border-b-2 border-amber-600' : 'text-stone-500 border-b-2 border-transparent hover:text-stone-800'}`}>{l}</button>
            ))}
          </div>
          <div className="flex-1 overflow-y-auto">
            {list.map(m => {
              const unread = tab === 'inbox' && !(m.readBy && m.readBy[TRAINER_ID]);
              return (
                <button key={m.id} onClick={() => setActiveId(m.id)}
                  className={`w-full text-left px-4 py-2.5 border-b border-stone-100 hover:bg-stone-50 ${active?.id === m.id ? 'bg-amber-50/60' : ''}`}>
                  <div className="flex items-start gap-2">
                    <div className={`w-1.5 h-1.5 rounded-full mt-2 shrink-0 ${unread ? 'bg-amber-500' : 'bg-transparent'}`}/>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-baseline justify-between gap-2">
                        <span className={`text-[12.5px] truncate ${unread ? 'font-semibold text-stone-900' : 'font-medium text-stone-700'}`}>
                          {tab === 'inbox' ? m.from?.name : (m.to?.scope === 'role' ? `Direct → ${m.to.role}` : (roster.find(r => r.id === m.to?.playerId)?.name || 'Direct'))}
                        </span>
                        <span className="text-[10.5px] text-stone-400 shrink-0">{fmtRel(m.sentAt)}</span>
                      </div>
                      <div className={`text-[12px] truncate ${unread ? 'text-stone-800 font-medium' : 'text-stone-600'}`}>{m.subject}</div>
                    </div>
                  </div>
                </button>
              );
            })}
            {list.length === 0 && <div className="text-center text-stone-500 py-8 text-[12.5px]">No messages.</div>}
          </div>
        </div>
        <div className="flex-1 overflow-y-auto bg-stone-50/50 p-7">
          {active ? (
            <div className="max-w-2xl mx-auto bg-white border border-stone-200 rounded-xl p-6">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[10.5px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-stone-100 text-stone-700">{active.kind === 'announcement' ? 'Team announcement' : 'Direct'}</span>
                <span className="text-[11.5px] text-stone-500">{new Date(active.sentAt).toLocaleString()}</span>
              </div>
              <h2 className="font-display text-xl font-bold text-stone-900 mt-2">{active.subject}</h2>
              <div className="mt-1 text-[12.5px] text-stone-600">From <span className="font-semibold">{active.from?.name}</span> ({active.from?.role})</div>
              <p className="text-[14px] text-stone-800 mt-4 whitespace-pre-wrap leading-relaxed">{active.body}</p>
            </div>
          ) : <div className="text-center text-stone-500 py-12 text-[13px]">Select a message.</div>}
        </div>
      </div>
      <ComposeModal open={composeOpen} onClose={() => setComposeOpen(false)} roster={roster}
        onSend={async msg => { await messages.save(msg); setComposeOpen(false); setTab('sent'); setActiveId(msg.id); }}/>
    </div>
  );
}
function ComposeModal({ open, onClose, roster, onSend }) {
  const TRAINER_ID = 'trainer-1';
  const [recipient, setRecipient] = useState('player');
  const [playerId, setPlayerId] = useState('');
  const [subject, setSubject] = useState('');
  const [body, setBody] = useState('');
  useEffect(() => { if (open) { setRecipient('player'); setPlayerId(''); setSubject(''); setBody(''); } }, [open]);
  const can = subject.trim() && body.trim() && (recipient !== 'player' || playerId);
  const send = () => {
    const to = recipient === 'coach' ? { scope:'role', role:'coach' } : { scope:'player', playerId };
    onSend({ id: newId('msg'), from: { role:'trainer', name: TRAINER.name, userId: TRAINER_ID }, to, kind:'direct', subject, body, sentAt: Date.now(), readBy:{}, threadId: newId('th') });
  };
  return (
    <Modal open={open} onClose={onClose} title="New message" subtitle="Send a message to a player or the coach." size="lg"
      footer={<>
        <button onClick={onClose} className="px-3.5 py-2 text-[13px] font-medium text-stone-700 hover:bg-stone-100 rounded-md btn-press">Cancel</button>
        <button disabled={!can} onClick={send} className="px-3.5 py-2 text-[13px] font-semibold rounded-md bg-amber-600 text-white hover:bg-amber-700 disabled:bg-stone-300 btn-press flex items-center gap-1.5"><I.Send className="w-4 h-4"/>Send</button>
      </>}>
      <SelectField label="Recipient" value={recipient} onChange={setRecipient}
        options={[{value:'player',label:'Player (MSG-04)'},{value:'coach',label:'Coach (MSG-05)'}]}/>
      {recipient === 'player' && (
        <SelectField label="Player" value={playerId} onChange={setPlayerId}
          options={[{ value:'', label:'— select player —' }, ...roster.map(r => ({ value:r.id, label:`#${r.number} ${r.name}` }))]}/>
      )}
      <TextField label="Subject" value={subject} onChange={setSubject} required/>
      <TextArea label="Message" value={body} onChange={setBody} rows={6}/>
    </Modal>
  );
}

function App() {

  const gate = useRoleGate('trainer');
  const roster = useCollection('roster', SEED_ROSTER);
  const messages = useCollection('messages', []);
  const [routeState, setRouteState] = useState({ route:'dashboard', params:{} });
  const TRAINER_ID = 'trainer-1';

  if (gate.checking) return <div className="h-full flex items-center justify-center text-stone-500 text-[13px]">Loading…</div>;
  if (gate.mismatch) return <RoleGateScreen role={gate.role} expected="trainer"/>;

  const unread = messages.items.filter(m => {
    if (m.from?.userId === TRAINER_ID) return false;
    const mine = (m.to?.scope === 'role' && m.to?.role === 'trainer') || (m.to?.scope === 'player');
    return mine && !(m.readBy && m.readBy[TRAINER_ID]);
  }).length;

  const go = (route, params = {}) => setRouteState({ route, params });
  const PageComp = ROUTES[routeState.route]?.component || DashboardPage;

  const signOut = async () => {
    await Storage.delete('currentUser:role');
    await Storage.delete('currentUser:name');
    await Storage.delete('currentUser:playerId');
    window.location.href = 'login.html';
  };

  return (
    <RouterCtx.Provider value={{ route: routeState.route, params: routeState.params, go }}>
      <div className="h-full flex">
        <Sidebar active={routeState.route} onSelect={(id) => go(id)} unreadCount={unread} onSignOut={signOut}/>
        <main className="flex-1 h-full overflow-hidden flex flex-col canvas-bg">
          <PageComp roster={roster.items}/>
        </main>
      </div>
    </RouterCtx.Provider>
  );
}

/* ============================================================
   Root wrapper — performs the active session check BEFORE App
   mounts, so React never sees hook-count mismatches between an
   early return and the post-verification render.
   ============================================================ */
function Root() {
  const [__sessionChecked, __setSessionChecked] = useState(false);
  const [__sessionUser, __setSessionUser] = useState(null);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (window.cs_auth) {
        const u = await window.cs_auth.requireSession('trainer');
        if (cancelled) return;
        __setSessionUser(u);
      } else {
        __setSessionUser({ role: 'trainer' });
      }
      if (!cancelled) __setSessionChecked(true);
    })();
    return () => { cancelled = true; };
  }, []);
  if (!__sessionChecked) {
    return (
      <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'#f8f6f3', color:'#78716c', fontSize:'13px', fontFamily:"'Plus Jakarta Sans', system-ui, sans-serif" }}>
        Verifying session…
      </div>
    );
  }
  if (!__sessionUser) return null;
  return <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
