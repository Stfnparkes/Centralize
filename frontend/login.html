<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centralize — Sign in</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0c0a09; background: #0a0a0a; overflow: hidden; }
  .font-display { font-family: 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.01em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .canvas-bg {
    background:
      radial-gradient(ellipse at 20% 15%, rgba(13, 148, 136, 0.18) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 85%, rgba(37, 99, 235, 0.18) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 20%, rgba(180, 83, 9, 0.15) 0%, transparent 45%),
      linear-gradient(135deg, #0a0a0a 0%, #1c1917 100%);
  }
  .btn-press:active { transform: translateY(1px) scale(0.98); }
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fade-up 0.35s ease-out backwards; }
</style>
</head>
<body>
<div id="root"></div>

<script src="runtime.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function Login() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [existingUser, setExistingUser] = useState(null);
  const emailRef = useRef(null);

  useEffect(() => {
    if (emailRef.current) emailRef.current.focus();
    (async () => {
      try {
        if (window.cs_auth && window.cs_auth.hasToken()) {
          const me = await window.cs_auth.me();
          if (me) setExistingUser(me);
        }
      } catch {}
    })();
  }, []);

  const targetFor = (role) =>
    role === 'player'  ? 'player-module.html' :
    role === 'coach'   ? 'coach-hub.html' :
    role === 'trainer' ? 'trainer-module.html' : 'login.html';

  const submit = async (e) => {
    e?.preventDefault?.();
    if (!email.trim() || !password) { setError('Enter your email and password.'); return; }
    setBusy(true);
    setError('');
    try {
      if (!window.cs_auth) throw new Error('Auth runtime not loaded. Is the server running?');
      const user = await window.cs_auth.login(email.trim(), password);
      setTimeout(() => { window.location.href = targetFor(user.role); }, 350);
    } catch (e) {
      setBusy(false);
      const msg = String(e?.message || '');
      if (msg.includes('HTTP 401') || msg === 'unauthenticated') setError('Invalid email or password.');
      else if (msg.startsWith('network error')) setError('Cannot reach the server. Is it running?');
      else setError(msg);
    }
  };

  const continueAs = async () => {
    if (!existingUser) return;
    setBusy(true);
    setTimeout(() => { window.location.href = targetFor(existingUser.role); }, 200);
  };

  const switchUser = async () => {
    try { if (window.cs_auth) await window.cs_auth.logout(); } catch {}
    setExistingUser(null);
    setEmail(''); setPassword('');
  };

  const fill = (e, p) => { setEmail(e); setPassword(p); setError(''); };

  return (
    <div className="h-full canvas-bg flex flex-col">
      <header className="px-6 sm:px-10 py-5 flex items-center justify-between text-stone-300">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-teal-500 to-blue-600 flex items-center justify-center shadow">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.8" className="w-5 h-5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18"/></svg>
          </div>
          <div>
            <div className="font-display font-bold text-white text-[15.5px]">Centralize</div>
            <div className="text-[11px] uppercase tracking-wider text-stone-400">Sports Performance Management</div>
          </div>
        </div>
      </header>

      <main className="flex-1 flex items-center justify-center px-6 pb-10">
        <div className="w-full max-w-md fade-up">
          <div className="text-center mb-6">
            <h1 className="font-display text-3xl sm:text-4xl font-bold text-white tracking-tight">Sign in</h1>
            <p className="text-stone-300 mt-2 text-[13.5px]">
              Use your team account. Your role opens automatically.
            </p>
          </div>

          {existingUser && (
            <div className="mb-5 bg-white/8 backdrop-blur border border-white/10 rounded-2xl p-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-teal-500 to-blue-600 flex items-center justify-center text-white text-[12px] font-bold">
                  {existingUser.name?.split(' ').map(w => w[0]).join('').slice(0,2)}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="text-[12px] text-stone-300">Resume session</div>
                  <div className="text-white font-semibold text-[14px] truncate">{existingUser.name}</div>
                  <div className="text-[11px] text-stone-400 uppercase tracking-wider">{existingUser.role}</div>
                </div>
                <button onClick={continueAs} disabled={busy} className="px-3 py-1.5 text-[12px] font-semibold rounded-md bg-white text-stone-900 hover:bg-stone-100 btn-press">Continue</button>
              </div>
              <button onClick={switchUser} className="mt-2 text-[11.5px] text-stone-400 hover:text-white">Sign in as someone else</button>
            </div>
          )}

          <form onSubmit={submit} className="bg-white rounded-2xl shadow-2xl p-7">
            <label className="block mb-3">
              <span className="block text-[11.5px] font-semibold text-stone-700 mb-1">Email</span>
              <input ref={emailRef} type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@team.example" autoComplete="email"
                className="w-full px-3 py-2.5 text-[14px] border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"/>
            </label>
            <label className="block mb-3">
              <span className="block text-[11.5px] font-semibold text-stone-700 mb-1">Password</span>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password"
                className="w-full px-3 py-2.5 text-[14px] border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"/>
            </label>

            {error && (
              <div className="mb-3 px-3 py-2 rounded-md bg-red-50 border border-red-200 text-[12.5px] text-red-700">
                {error}
              </div>
            )}

            <button type="submit" disabled={busy}
              className="w-full mt-1 px-4 py-2.5 text-[14px] font-semibold rounded-md bg-gradient-to-r from-teal-600 to-blue-600 text-white hover:from-teal-700 hover:to-blue-700 disabled:opacity-60 btn-press">
              {busy ? 'Signing in…' : 'Sign in'}
            </button>
          </form>

          <div className="mt-5 bg-white/5 backdrop-blur border border-white/10 rounded-xl p-4 text-[11.5px] text-stone-300">
            <div className="font-semibold uppercase tracking-wider text-[10.5px] text-stone-400 mb-2">Demo credentials</div>
            <div className="space-y-1">
              <Cred email="coach@team.example" pwd="coach123" onFill={fill}/>
              <Cred email="trainer@team.example" pwd="trainer123" onFill={fill}/>
              <Cred email="pl-1@team.example" pwd="player123" onFill={fill} note="M. Anderson (PG)"/>
              <Cred email="pl-3@team.example" pwd="player123" onFill={fill} note="J. Carter (SF)"/>
              <Cred email="pl-6@team.example" pwd="player123" onFill={fill} note="A. Thompson (PG)"/>
            </div>
            <div className="mt-2 text-[10.5px] text-stone-400">All 10 players accept <span className="font-mono">pl-1</span>..<span className="font-mono">pl-10</span>@team.example with password <span className="font-mono">player123</span>.</div>
          </div>
        </div>
      </main>

      <footer className="px-6 sm:px-10 py-4 text-[11px] text-stone-500 flex items-center justify-between flex-wrap gap-2">
        <span>&nbsp;</span>
        <span>Prototype — passwordless production wiring is documented in the README.</span>
      </footer>
    </div>
  );
}

function Cred({ email, pwd, note, onFill }) {
  return (
    <button type="button" onClick={() => onFill(email, pwd)}
      className="w-full flex items-center gap-2 text-left rounded-md px-2 py-1 hover:bg-white/10">
      <span className="font-mono text-stone-200 text-[11px]">{email}</span>
      <span className="text-stone-500">/</span>
      <span className="font-mono text-stone-300 text-[11px]">{pwd}</span>
      {note && <span className="text-stone-400 text-[10.5px] ml-auto">{note}</span>}
    </button>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Login/>);
</script>
</body>
</html>
