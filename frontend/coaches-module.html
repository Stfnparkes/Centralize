/** Render a small SVG preview of a play */
function PlayThumbnail({ play }) {
  const positions = play.positions || {};
  const hasPlayers = Object.keys(positions).length > 0;
  return (
    <svg viewBox="0 0 500 470" className="w-full h-full">
      <rect width="500" height="470" fill="#e2b97f"/>
      <rect x="170" y="0" width="160" height="190" fill="none" stroke="white" strokeWidth="4"/>
      <path d="M 30 140 A 237.5 237.5 0 0 0 470 140" fill="none" stroke="white" strokeWidth="4"/>
      <line x1="30" y1="0" x2="30" y2="140" stroke="white" strokeWidth="4"/>
      <line x1="470" y1="0" x2="470" y2="140" stroke="white" strokeWidth="4"/>
      <circle cx="250" cy="52.5" r="9" fill="none" stroke="#d97706" strokeWidth="3"/>
      {hasPlayers && OFFENSE.map((pl) => {
        const pos = positions[pl.id]; if (!pos) return null;
        return <g key={pl.id}><circle cx={pos.x} cy={pos.y} r="22" fill="white" stroke="#1c1917" strokeWidth="3"/><text x={pos.x} y={pos.y+8} textAnchor="middle" fontSize="22" fontWeight="800">{pl.number}</text></g>;
      })}
      {(play.drawings || []).slice(0, 6).map((d) => {
        if (d.type === 'arrow' || d.type === 'pass' || d.type === 'dribble')
          return <line key={d.id} x1={d.x1} y1={d.y1} x2={d.x2} y2={d.y2} stroke={d.type==='pass'?'#0f766e':'#dc2626'} strokeWidth="3" strokeDasharray={d.type==='pass'?'6 4':d.type==='dribble'?'4 3':''}/>;
        return null;
      })}
    </svg>
  );
}

function fmtRelative(ts) {
  if (!ts) return 'never';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

    { id:7, name:'R. Davis',    pos:'SG', mins:20 },
    { id:8, name:'C. Martinez', pos:'SF', mins:18 },
    { id:9, name:'B. White',    pos:'PF', mins:14 },
    { id:10,name:'T. Hall',     pos:'C',  mins:11 },
  ],
};

function RotationsPage() {
  const games = useCollection('games', SEED_GAMES);
  const [gameId, setGameId] = useState('general');
  const storageKey = gameId === 'general' ? 'rotations:current' : `rotations:${gameId}`;
  const [rotation, setRotation, loaded] = useStored(storageKey, SEED_ROTATION);
  const [editing, setEditing] = useState(null);

  const selectedGame = games.items.find((g) => g.id === gameId);

  const updateMins = (id, mins) => {
    setRotation({ ...rotation, players: rotation.players.map((p) => p.id === id ? { ...p, mins: Math.max(0, Math.min(rotation.totalMinutes, mins || 0)) } : p) });
  };
  const updateName = (id, name) => setRotation({ ...rotation, players: rotation.players.map((p) => p.id === id ? { ...p, name } : p) });
  const updatePos  = (id, pos)  => setRotation({ ...rotation, players: rotation.players.map((p) => p.id === id ? { ...p, pos } : p) });
  const removePlayer = (id)     => setRotation({ ...rotation, players: rotation.players.filter((p) => p.id !== id) });
  const addPlayer = () => {
    const nextId = Math.max(0, ...rotation.players.map((p) => p.id)) + 1;
    setRotation({ ...rotation, players: [...rotation.players, { id: nextId, name: 'New player', pos: 'G', mins: 0 }] });
  };

  const totalAllocated = rotation.players.reduce((s, p) => s + (p.mins || 0), 0);
  const targetTotal = rotation.totalMinutes * 5;     // 5 players on floor at all times
  const remaining = targetTotal - totalAllocated;

  if (!loaded) return <div className="flex-1 flex items-center justify-center text-stone-500">Loading…</div>;

  return (
    <>
      <PageHeader title="Rotations" subtitle="Plan minutes per game. Click any value to edit." action={
        <button onClick={addPlayer} className="px-3.5 py-2 text-[13px] bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-md flex items-center gap-1.5 btn-press"><I.Plus className="w-4 h-4"/> Add player</button>
      }/>
      <div className="flex-1 overflow-y-auto p-7">

   ========================================================================= */
const SEED_LINEUP = {
  onFloor: [
    { id:1, name:'M. Anderson', mins:18 },
    { id:2, name:'D. Wilson',   mins:16 },
    { id:3, name:'J. Carter',   mins:14 },
    { id:4, name:'K. Brown',    mins:12 },
    { id:5, name:'L. Mitchell', mins:10 },
  ],
  bench: [
    { id:6,  name:'A. Thompson', mins:0 },
    { id:7,  name:'R. Davis',    mins:4 },
    { id:8,  name:'C. Martinez', mins:2 },
    { id:9,  name:'B. White',    mins:0 },
    { id:10, name:'T. Hall',     mins:0 },
  ],
};

function SubManagerPage() {
  const [lineup, setLineup, loaded] = useStored('subManager:current', SEED_LINEUP);
  const [pickingFor, setPickingFor] = useState(null);   // floor player to swap out

  const swap = (floorId, benchId) => {
    const floor = lineup.onFloor.find((p) => p.id === floorId);
    const bench = lineup.bench.find((p) => p.id === benchId);
    if (!floor || !bench) return;
    setLineup({
      ...lineup,
      onFloor: lineup.onFloor.map((p) => p.id === floorId ? bench : p),
      bench:   lineup.bench.map((p) => p.id === benchId ? floor : p),
    });
    setPickingFor(null);
  };

  const addBench = () => {
    const nextId = Math.max(0, ...[...lineup.onFloor, ...lineup.bench].map((p) => p.id)) + 1;
    setLineup({ ...lineup, bench: [...lineup.bench, { id: nextId, name: 'New player', mins: 0 }] });
  };

  // Substitution pairing plan (ROT-03): map each starter -> designated sub
  const subPlan = lineup.subPlan || {};
  const setSub = (starterId, subId) => {
    setLineup({ ...lineup, subPlan: { ...subPlan, [starterId]: subId || undefined } });
  };

  if (!loaded) return <div className="flex-1 flex items-center justify-center text-stone-500">Loading…</div>;

  return (
    <>
      <PageHeader title="Sub Manager" subtitle="Define a substitution plan, then run live swaps on game day." action={
        <button onClick={addBench} className="px-3.5 py-2 text-[13px] text-stone-700 hover:bg-stone-100 border border-stone-300 font-medium rounded-md flex items-center gap-1.5 btn-press"><I.Plus className="w-4 h-4"/> Add bench player</button>
      }/>
      <div className="flex-1 overflow-y-auto p-7">
        {pickingFor && (
          <div className="mb-4 bg-amber-50 border border-amber-300 rounded-xl px-4 py-2.5 flex items-center justify-between gap-3">
            <div className="text-[13px] text-amber-900 flex items-center gap-2"><I.Swap className="w-4 h-4"/> Swapping out <span className="font-semibold">{lineup.onFloor.find((p) => p.id === pickingFor)?.name}</span> — pick a bench player.</div>
            <button onClick={() => setPickingFor(null)} className="text-[12px] text-amber-900 hover:underline font-medium">Cancel</button>
          </div>
        )}

        {/* Substitution plan (ROT-03) */}
        <div className="bg-white border border-stone-200 rounded-xl overflow-hidden mb-5">
          <div className="px-5 py-3.5 border-b border-stone-200">
            <div className="font-display font-semibold text-stone-900 flex items-center gap-2"><I.Swap className="w-4 h-4 text-teal-600"/> Substitution plan</div>
            <div className="text-[12px] text-stone-500 mt-0.5">Pair each starter with the player who comes in for them.</div>
          </div>
          <div className="divide-y divide-stone-100">
            {lineup.onFloor.map((starter) => (
              <div key={starter.id} className="flex items-center gap-3 px-5 py-2.5">
                <div className="w-7 h-7 rounded-full bg-red-100 text-red-700 flex items-center justify-center text-[11px] font-bold shrink-0">{starter.id}</div>
                <div className="text-[13px] font-medium text-stone-900 w-40 truncate">{starter.name}</div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="w-4 h-4 text-stone-400 shrink-0"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                <select value={subPlan[starter.id] || ''} onChange={(e) => setSub(starter.id, e.target.value ? Number(e.target.value) : null)}
                  className="px-2.5 py-1.5 text-[12.5px] border border-stone-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 flex-1 max-w-xs">
                  <option value="">— No designated sub —</option>
                  {lineup.bench.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
                {subPlan[starter.id] && (
                  <button onClick={() => swap(starter.id, subPlan[starter.id])} className="px-2.5 py-1.5 text-[11.5px] bg-teal-600 hover:bg-teal-700 text-white font-medium rounded btn-press">Execute sub</button>
                )}
              </div>
            ))}
          </div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div className="bg-white border border-stone-200 rounded-xl p-5">
            <div className="text-[10.5px] font-bold uppercase tracking-wider text-red-700 mb-2 flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full bg-red-600"/> On floor · {lineup.onFloor.length}/5</div>
            <div className="space-y-2">{lineup.onFloor.map((p) => (
              <button key={p.id} onClick={() => setPickingFor(pickingFor === p.id ? null : p.id)}
                className={`w-full flex items-center gap-3 px-3 py-2 border rounded-md text-left transition-colors ${pickingFor === p.id ? 'bg-amber-50 border-amber-400 ring-2 ring-amber-200' : 'bg-red-50 border-red-100 hover:border-red-300'}`}>
                <div className="w-7 h-7 rounded-full bg-red-100 text-red-700 flex items-center justify-center text-[11px] font-bold">{p.id}</div>
                <div className="flex-1 text-[13px] font-medium text-stone-900">{p.name}</div>
                {subPlan[p.id] && <span className="text-[10px] text-stone-500">↔ {lineup.bench.find(b=>b.id===subPlan[p.id])?.name || '—'}</span>}
                <div className="text-[11px] font-mono text-stone-500">{p.mins} min</div>
              </button>
            ))}</div>
          </div>
          <div className="bg-white border border-stone-200 rounded-xl p-5">
            <div className="text-[10.5px] font-bold uppercase tracking-wider text-stone-500 mb-2 flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full bg-stone-400"/> On bench · {lineup.bench.length}</div>
            <div className="space-y-2">{lineup.bench.map((p) => (
              <div key={p.id} className="flex items-center gap-3 px-3 py-2 hover:bg-stone-50 rounded-md">
                <div className="w-7 h-7 rounded-full bg-stone-100 text-stone-700 flex items-center justify-center text-[11px] font-bold">{p.id}</div>
                <div className="flex-1 text-[13px] font-medium text-stone-900">{p.name}</div>
                <div className="text-[11px] font-mono text-stone-500">{p.mins} min</div>
                {pickingFor ? (
                  <button onClick={() => swap(pickingFor, p.id)} className="px-2 py-1 text-[11px] bg-teal-600 hover:bg-teal-700 text-white font-medium rounded btn-press">Swap in</button>
                ) : (
                  <button onClick={() => { const last = lineup.onFloor[lineup.onFloor.length - 1]?.id; setPickingFor(last); setTimeout(() => swap(last, p.id), 0); }}
                    className="text-[11px] text-teal-700 hover:text-teal-900 font-medium">Sub in →</button>
                )}
              </div>
            ))}</div>
          </div>
        </div>
        <div className="mt-4 bg-stone-900 text-white rounded-xl p-5 text-[13px]">
          <div className="font-display font-semibold mb-1 flex items-center gap-2"><I.Sparkles className="w-4 h-4 text-teal-300"/> Coach assistant</div>
          <p className="text-stone-300 leading-relaxed text-[12.5px]">Suggestions will appear here based on minutes played, foul trouble, and matchup fit. Use the substitution plan above to pre-pair starters with their replacements.</p>
        </div>
      </div>
    </>
  );
}

/* =========================================================================
   IMAGES — real upload, downsamples to max 1280px, stores data URL
   ========================================================================= */
function ImagesPage() {
  const { items, save, remove, loaded } = useCollection('images', []);
  const fileRef = useRef(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [preview, setPreview] = useState(null);

  const downsample = (file) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.85), width: w, height: h });
    };
    img.onerror = () => reject(new Error('Could not load image'));
    img.src = URL.createObjectURL(file);
  });

  const handleFiles = async (fileList) => {
    setError(null); setBusy(true);
    try {
      for (const file of fileList) {
        if (!/^image\//.test(file.type)) { setError(`"${file.name}" is not an image`); continue; }
        const { dataUrl, width, height } = await downsample(file);
        if (dataUrl.length > 4.5 * 1024 * 1024) { setError(`"${file.name}" is too large after compression`); continue; }
        await save({ id: newId('img'), name: file.name, dataUrl, width, height, sizeBytes: file.size, mime: 'image/jpeg' });
      }
    } catch (e) { setError(e.message); }
    finally { setBusy(false); if (fileRef.current) fileRef.current.value = ''; }
  };

  return (
    <>
      <PageHeader title="Images" subtitle={loaded ? `${items.length} ${items.length === 1 ? 'image' : 'images'}` : 'Loading…'} action={
        <>
          <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => handleFiles(Array.from(e.target.files || []))}/>
          <button onClick={() => fileRef.current?.click()} disabled={busy} className="px-3.5 py-2 text-[13px] bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-md flex items-center gap-1.5 btn-press disabled:opacity-60">
            <I.Upload className="w-4 h-4"/> {busy ? 'Uploading…' : 'Upload images'}
          </button>
        </>
      }/>
      <div className="flex-1 overflow-y-auto p-7">
        {error && (
          <div className="mb-4 px-3 py-2 bg-red-50 border border-red-200 rounded-md text-[12.5px] text-red-700 flex items-center justify-between">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="text-red-700"><I.Close className="w-4 h-4"/></button>
          </div>
        )}
        {loaded && items.length === 0 ? (
          <button onClick={() => fileRef.current?.click()}
            className="block w-full bg-white border-2 border-dashed border-stone-300 hover:border-teal-500 hover:bg-teal-50/30 rounded-2xl py-16 text-center transition-colors btn-press">
            <I.ImageIcon className="w-12 h-12 text-stone-400 mx-auto mb-3"/>
            <div className="font-display text-lg font-semibold text-stone-700 mb-1">No images yet</div>
            <div className="text-[13px] text-stone-500">Click here or drag and drop to upload</div>
            <div className="text-[11.5px] text-stone-400 mt-2">JPG, PNG, WEBP · auto-resized to 1280px max</div>
          </button>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
            {items.map((img) => (
              <div key={img.id} className="aspect-square rounded-lg overflow-hidden border border-stone-200 relative group bg-stone-100">
                <button onClick={() => setPreview(img)} className="w-full h-full">
                  <img src={img.dataUrl} alt={img.name} className="w-full h-full object-cover"/>
                </button>
                <button onClick={() => setConfirmDelete(img)}
                  className="absolute top-1.5 right-1.5 w-7 h-7 rounded-full bg-stone-900/70 hover:bg-red-600 text-white opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                  <I.Trash className="w-3.5 h-3.5"/>
                </button>
                <div className="absolute bottom-0 left-0 right-0 p-2 text-[10px] font-medium text-white bg-gradient-to-t from-black/80 to-transparent truncate">{img.name}</div>
              </div>
            ))}
            <button onClick={() => fileRef.current?.click()} className="aspect-square rounded-lg border-2 border-dashed border-stone-300 hover:border-teal-500 hover:bg-teal-50/30 flex flex-col items-center justify-center text-stone-500 hover:text-teal-700 btn-press transition-colors">
              <I.Plus className="w-6 h-6 mb-0.5"/><span className="text-[11.5px] font-medium">Add more</span>
            </button>
          </div>
        )}
      </div>

      {/* Lightbox preview */}
      {preview && (
        <div className="fixed inset-0 z-50 bg-stone-950/85 flex items-center justify-center p-4" onClick={() => setPreview(null)}>
          <div className="max-w-5xl max-h-[90vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
            <img src={preview.dataUrl} alt={preview.name} className="max-w-full max-h-[80vh] object-contain rounded-lg"/>
            <div className="text-center mt-3 text-white text-[13px]">{preview.name} · {preview.width}×{preview.height}</div>
          </div>
          <button onClick={() => setPreview(null)} className="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center"><I.Close className="w-5 h-5"/></button>
        </div>
      )}

      <ConfirmDialog
        open={!!confirmDelete}
        title="Delete image?"
        message={confirmDelete ? `"${confirmDelete.name}" will be permanently removed.` : ''}
        onConfirm={async () => { await remove(confirmDelete.id); setConfirmDelete(null); }}
        onCancel={() => setConfirmDelete(null)}
      />
    </>
  );
}

/* =========================================================================
   AUDIO — real upload, HTML5 audio playback
   ========================================================================= */
function AudioPage() {
  const { items, save, remove, loaded } = useCollection('audio', []);
  const fileRef = useRef(null);
  const audioRef = useRef(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [playingId, setPlayingId] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const readFile = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });

  const handleFiles = async (fileList) => {
    setError(null); setBusy(true);
    try {
      for (const file of fileList) {
        if (!/^audio\//.test(file.type)) { setError(`"${file.name}" is not an audio file`); continue; }
        if (file.size > 4 * 1024 * 1024) { setError(`"${file.name}" is too large (4 MB max)`); continue; }
        const dataUrl = await readFile(file);
        // Probe duration by loading into an Audio element
        const duration = await new Promise((resolve) => {
          const a = new Audio(); a.src = dataUrl;
          a.addEventListener('loadedmetadata', () => resolve(a.duration));
          a.addEventListener('error', () => resolve(0));
        });
        await save({ id: newId('aud'), name: file.name, dataUrl, duration, sizeBytes: file.size, mime: file.type });
      }
    } catch (e) { setError(e.message); }
    finally { setBusy(false); if (fileRef.current) fileRef.current.value = ''; }
  };

  const togglePlay = (item) => {
    if (playingId === item.id) {
      audioRef.current?.pause(); setPlayingId(null);
    } else {
      if (audioRef.current) {
        audioRef.current.src = item.dataUrl;
        audioRef.current.play().catch(() => setError('Playback failed'));
        setPlayingId(item.id);
      }
    }
  };

  const fmtDur = (s) => {
    if (!s || !isFinite(s)) return '—';
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${r.toString().padStart(2,'0')}`;
  };

  return (
    <>
      <PageHeader title="Audio" subtitle={loaded ? `${items.length} ${items.length === 1 ? 'clip' : 'clips'}` : 'Loading…'} action={
        <>
          <input ref={fileRef} type="file" accept="audio/*" multiple className="hidden" onChange={(e) => handleFiles(Array.from(e.target.files || []))}/>
          <button onClick={() => fileRef.current?.click()} disabled={busy} className="px-3.5 py-2 text-[13px] bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-md flex items-center gap-1.5 btn-press disabled:opacity-60">
            <I.Upload className="w-4 h-4"/> {busy ? 'Uploading…' : 'Upload audio'}
          </button>
        </>
      }/>
      <div className="flex-1 overflow-y-auto p-7">
        {error && (
          <div className="mb-4 px-3 py-2 bg-red-50 border border-red-200 rounded-md text-[12.5px] text-red-700 flex items-center justify-between">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="text-red-700"><I.Close className="w-4 h-4"/></button>
          </div>
        )}
        <audio ref={audioRef} onEnded={() => setPlayingId(null)} className="hidden"/>
        {loaded && items.length === 0 ? (
          <button onClick={() => fileRef.current?.click()}
            className="block w-full bg-white border-2 border-dashed border-stone-300 hover:border-teal-500 hover:bg-teal-50/30 rounded-2xl py-16 text-center transition-colors btn-press">
            <I.Mic className="w-12 h-12 text-stone-400 mx-auto mb-3"/>
            <div className="font-display text-lg font-semibold text-stone-700 mb-1">No audio yet</div>
            <div className="text-[13px] text-stone-500">Click here to upload voice memos and recorded talks</div>
            <div className="text-[11.5px] text-stone-400 mt-2">MP3, WAV, M4A · 4 MB max per file</div>
          </button>
        ) : (
          <div className="bg-white border border-stone-200 rounded-xl divide-y divide-stone-200">
            {items.map((c) => (
              <div key={c.id} className="flex items-center gap-3 px-4 py-3 group">
                <button onClick={() => togglePlay(c)}
                  className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${playingId === c.id ? 'bg-teal-600 text-white' : 'bg-teal-50 hover:bg-teal-100 text-teal-700'}`}>
                  {playingId === c.id ? <I.Pause className="w-4 h-4"/> : <I.Play className="w-4 h-4 ml-0.5"/>}
                </button>
                <div className="flex-1 min-w-0">
                  <div className="text-[13.5px] font-medium text-stone-900 truncate">{c.name}</div>
                  <div className="flex items-center gap-2 mt-1">
                    <I.Mic className="w-3 h-3 text-stone-400"/>
                    <div className="text-[11px] font-mono text-stone-500">{fmtDur(c.duration)}</div>
                    <span className="text-stone-300">·</span>
                    <div className="text-[11px] text-stone-500">{(c.sizeBytes / 1024).toFixed(0)} KB</div>
                  </div>
                </div>
                <button onClick={() => setConfirmDelete(c)} className="text-stone-400 hover:text-red-600 p-1.5 opacity-0 group-hover:opacity-100 transition-opacity"><I.Trash className="w-4 h-4"/></button>
              </div>
            ))}
            <button onClick={() => fileRef.current?.click()} className="w-full px-4 py-3 text-[13px] text-stone-500 hover:text-teal-700 hover:bg-teal-50/30 flex items-center justify-center gap-2 btn-press">
              <I.Plus className="w-4 h-4"/> Add more clips
            </button>
          </div>
        )}
      </div>

      <ConfirmDialog
        open={!!confirmDelete}
        title="Delete audio clip?"
        message={confirmDelete ? `"${confirmDelete.name}" will be permanently removed.` : ''}
        onConfirm={async () => {
          if (playingId === confirmDelete.id) { audioRef.current?.pause(); setPlayingId(null); }
          await remove(confirmDelete.id); setConfirmDelete(null);
        }}
        onCancel={() => setConfirmDelete(null)}
      />
    </>
  );
}

function App() {
  const [routeState, setRouteState] = useState({ name: 'studio', params: {} });
  const [collapsed, setCollapsed] = useStored('ui:sidebarCollapsed', false);

  const go = useCallback((name, params = {}) => {
    setRouteState({ name, params });
  }, []);

  const route = routeState.name;
  const params = routeState.params;

  // Map sidebar nav id ↔ route name (sidebar uses `videos` for the studio screen so the highlight reads naturally)
  const navToRoute = { plays:'plays', playbooks:'playbooks', playLib:'playLib', drills:'drills', practice:'practice', drillLib:'drillLib', rotations:'rotations', subs:'subs', videos:'studio', images:'images', audio:'audio' };
  const navFromRoute = ROUTES[route]?.nav || 'videos';

  const RouteComponent = ROUTES[route]?.component || PlaysListPage;

  return (
    <RouterCtx.Provider value={{ route, params, go }}>
      <div className="h-screen w-screen flex bg-stone-100 overflow-hidden">
        <Sidebar
          active={navFromRoute}
          onSelect={(id) => go(navToRoute[id] || 'plays')}
          collapsed={collapsed}
          onToggleCollapse={() => setCollapsed(!collapsed)}
        />
        <main className="flex-1 flex flex-col canvas-bg min-w-0">
          <TopBar collapsed={collapsed} onToggleCollapse={() => setCollapsed(!collapsed)} route={route} params={params}/>
          <RouteComponent/>
        </main>
      </div>
    </RouterCtx.Provider>
  );
}


/* ============================================================
   Root wrapper — performs the session check BEFORE App mounts.
   App owns no session-state hooks; Rules of Hooks are preserved.
   ============================================================ */
function Root() {
  const [__sessionChecked, __setSessionChecked] = useState(false);
  const [__sessionUser, __setSessionUser] = useState(null);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (window.cs_auth) {
        const u = await window.cs_auth.requireSession('coach');
        if (cancelled) return;
        __setSessionUser(u);
      } else {
        __setSessionUser({ role: 'coach' });
      }
      if (!cancelled) __setSessionChecked(true);
    })();
    return () => { cancelled = true; };
  }, []);
  if (!__sessionChecked) {
    return (
      <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'#f8f6f3', color:'#78716c', fontSize:'13px', fontFamily:"'Plus Jakarta Sans', system-ui, sans-serif" }}>
        Verifying session…
      </div>
    );
  }
  if (!__sessionUser) return null;
  return <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
